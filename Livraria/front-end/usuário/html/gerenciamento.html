<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Sistema CEFET-RJ</title>

    <script src="Livraria/front-end/usuário/js/gerenciamento.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Sistema</h1>

        <section class="acoes">

        <section id="areaBusca">

            <div id="saidaBusca" class="resultado"></div>
        </section>
    </div>

</html>
